<header>

            <a href="index.html">Beranda</a>
            <a href="tentang.html">Tentang</a>
            <a href="portofolio.html">Portofolio</a>
            <a href="kontak.html" class="aktif">Kontak</a>
        </nav>

        <button class="theme-toggle">Mode Gelap</button>
    </div>
</header>

<main>

    <section>
        <h2>Hubungi Saya</h2>

        <p>Email: nayla@gmail.com | Telepon: 085234567890</p>

        <form action="#" method="post">

            <label for="nama">Nama Lengkap</label>
            <input type="text" id="nama" name="nama" required minlength="3">

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="telp">Nomor Telepon</label>
            <input type="tel" id="telp" name="telp"
                   pattern="[0-9]{10,13}"
                   title="Masukkan 10-13 digit angka">

            <label for="subjek">Subjek</label>

            <select id="subjek" name="subjek" required>
                <option value="">-- Pilih subjek --</option>
                <option>Kerja sama</option>
                <option>Pertanyaan</option>
                <option>Lainnya</option>
            </select>

            <label for="pesan">Pesan</label>
            <textarea id="pesan" name="pesan" rows="5" required></textarea>

            <label>
                <input type="checkbox" name="setuju" required>
                Saya menyetujui data saya digunakan untuk membalas pesan ini
            </label>

            <button type="submit" class="tombol">Kirim Pesan</button>

        </form>
    </section>

</main>
